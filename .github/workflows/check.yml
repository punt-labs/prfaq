name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install jq and a full TeX distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq texlive-full biber

      - name: make check
        run: make check
