#=============================================================================
# banlist.conf
#
# SINGLE SOURCE OF TRUTH. No term list exists anywhere else.
#
# TO BAN A WORD: type it on its own line under [banned]. Save. Done.
#
# Format rules, all of them:
#   - A line starting with # is a comment. Blank lines are ignored.
#   - [section] starts a section.
#   - In term sections, the whole line is the term. No quotes, no commas.
#   - In [rationed], "term: 0.5" sets a per-term rate. Bare terms use the
#     default rate from [settings].
#   - In [settings], "key = value".
#   - In [banned.patterns], "id :: label :: regex".
#
# Three tiers:
#   banned    zero occurrences. any hit exits 2. document length is irrelevant.
#   rationed  allowed up to N per 1000 words. over the rate exits 1.
#   review    never fails. queued for you, because the literal use is valid.
#
# Expected workflow: a term sits in [review] or [rationed] until it annoys
# you, then you move the line to [banned]. Cutting a ban is the same edit
# in reverse.
#=============================================================================

#-----------------------------------------------------------------------------
# CALIBRATION BASELINES
#
# Three measured documents. Thresholds are set above what good prose actually
# does, so a clean document stays quiet.
#
#   A  Roux, Goldsmith & Bonezzi, "On the Psychology of Scarcity",
#      Journal of Consumer Research 42(4), 2015. 9,818 words. Published prose,
#      eight years before ChatGPT, so it cannot be contaminated.
#   B  Author's own Oxford EMBA assignment, 1,413 words, awarded a distinction.
#      Written under exam conditions to a 1,500-word limit, with no tools and
#      no peer review. This is the target voice.
#   C  An AI-written LaTeX paper, 3,427 words, heavily human-edited.
#
#                          A: published   B: author    C: AI
#   banned terms                      0           0        22
#   em dashes                         0           0        20  (5.8/1000)
#   flowery vocabulary          0.1-0.2         0.0       0.0
#   nominalizations /1000          2.85        0.71      2.92
#   passive                       31.3%       13.0%     24.2%
#   sentence median                  28          23        21
#   sentence p90                     51          56        46
#
# Two findings drive the numbers below.
#
# First, B is the cleanest of the three on both mechanical measures: four
# times fewer nominalizations than published academic prose and less than
# half the passive. Thresholds are set from B, not from A.
#
# Second, the discriminator between human and AI prose here is punctuation,
# not vocabulary. C matched or beat A on vocabulary, passive, and sentence
# length. It failed on 20 em dashes. That is why the dash patterns are tier 1
# and much of the vocabulary list is only rationed.
#-----------------------------------------------------------------------------

[settings]
density_unit = 1000

# Baseline runs 0.1 to 0.2 per term. 0.5 leaves room without licensing habit.
default_max_per_1000 = 0.5

# A rationed term needs at least this many occurrences before its rate is
# judged. Without a floor, one use in a 400-word note produces a rate of
# 2.5 and a low limit becomes an accidental ban. Set a term's rate to 0.0
# in [rationed] to report every occurrence and bypass this floor.
min_occurrences_for_density = 2

# Structural checks. Set to 0 or off to disable one.
# These defaults follow the business profile. Use --profile academic, or a
# per-file "profile=academic" directive, for scholarly prose.
max_sentence_words = 30
staccato_run_length = 4
staccato_short_words = 8
passive_ratio_warn = 0.20              # author 13.0%
nominalization_per_1000_warn = 2.5     # author 0.71
emoji = banned
hr_divider = rationed
conclusion_header = rationed
title_case_headings = off

# Parsing
skip_code_blocks = on
skip_inline_code = on
skip_urls = on
skip_blockquotes = off
skip_tables = off
suppression_marker = lint-ok


#-----------------------------------------------------------------------------
# PROFILES
#
# Registers differ in ways that are not errors. The calibration paper runs a
# median sentence of 28 words and a third of its verbs in the passive. A memo
# written that way would be unreadable, and a journal article held to a
# 30-word limit would be rejected. One threshold cannot serve both.
#
# Select with --profile NAME, or per file:
#     <!-- lint-config: profile=academic -->
#
# Vocabulary tiers are shared. Only thresholds change.
#-----------------------------------------------------------------------------

[profile.business]
# Memos, specs, email, documentation. PRECISE-LLM rule 8 applies here.
# Author's own prose sits well inside every one of these.
max_sentence_words = 30                # author median 23
passive_ratio_warn = 0.20              # author 13.0%
nominalization_per_1000_warn = 2.5     # author 0.71
default_max_per_1000 = 0.5

[profile.academic]
# Scholarly prose, including a compressed assignment written to a word limit.
# The business thresholds flag the published paper 134 times, which is why
# this profile exists.
max_sentence_words = 65                # A p90 51 / max 109, B p90 56
passive_ratio_warn = 0.38              # A 31.3%
nominalization_per_1000_warn = 4.5     # A 2.85
default_max_per_1000 = 0.5

[profile.strict]
# For drafts published under your own name. Tighter than the author's own
# distinction-level work on sentence length, deliberately, because that work
# was written to a word limit under exam conditions.
#
# passive was 0.12 until the author's sample measured 13.0% and failed. A
# threshold below what your best writing does is a threshold you will learn
# to ignore. Raised to 0.18.
max_sentence_words = 25
passive_ratio_warn = 0.18              # author 13.0%
nominalization_per_1000_warn = 1.5     # author 0.71
default_max_per_1000 = 0.25


#-----------------------------------------------------------------------------
# TIER 1: BANNED. Zero tolerance.
#-----------------------------------------------------------------------------
[banned]

# Named explicitly as intolerable
torpedo alert
torpedo alerts

# Borrowed-domain metaphors.
# Hyphen and space are the same pattern, so "load-bearing" also catches
# "load bearing". Listing both would double-report every hit.
load-bearing
seam
seams
out loud

# Measured statistical fingerprints
delve
delves
delving

# Self-qualifying candour. Implies the other statements were not.
honestly
the honest
an honest
genuinely

# Corporate register
double-click on
at the end of the day


#-----------------------------------------------------------------------------
# Banned as metaphor, allowed literally. Add the literal forms to [exempt].
#-----------------------------------------------------------------------------
[banned.metaphor]
shape
move


#-----------------------------------------------------------------------------
# Constructions. Regex, because no word list can express them.
# Format: id :: label :: regex
#-----------------------------------------------------------------------------
[banned.patterns]
not-x-but-y :: negative parallelism, ~6% of ChatGPT output :: (?i)\b(?:it(?:'s| is)|this is|that(?:'s| is))\s+not\s+(?:just\s+)?[^.!?;:]{1,60}?,?\s+it(?:'s| is)\s+
em-dash :: em dash :: —
# Word characters required on both sides. That is how a LaTeX dash is
# written (word---word) and it keeps YAML fences, markdown dividers, table
# delimiters, and CLI flags such as --profile out of the results.
em-dash-source :: em dash written as --- in LaTeX or markdown source :: (?<=\w)---(?=\w)
em-dash-macro :: em dash as a LaTeX macro :: \\(?:textemdash|emdash)\b
en-dash-source :: en dash written as -- in LaTeX source :: (?<=\w)--(?=\w)
whole-x :: totalising the whole/entire X :: (?i)\bthe (?:whole|entire) (?!world\b|market\b|team\b)[a-z]+\b
# First-cut. Catches the class of sentence that steps outside the document
# to narrate its own status to the reader ("this PR/FAQ is aspirational",
# "written from today", "reporting retrospectively") instead of just being
# the document. Extend the alternation as new phrasings of the same move
# turn up in review -- this is not meant to be the last word on the pattern.
meta-explains-convention :: metacommentary explaining the document's own convention to the reader :: (?i)\b(?:is|marks?)\s+aspirational\b|\bwritten from today\b|\breport(?:s|ed|ing)?\s+retrospectively\b|\bthe reader should (?:note|know)\b


#-----------------------------------------------------------------------------
# EXEMPT. Correct English that contains a banned term. Checked first, so
# these never produce a finding.
#-----------------------------------------------------------------------------
# An asterisk matches up to three intervening words, so "read * out loud"
# covers "read the passage out loud".
[exempt]
load-bearing wall
load-bearing walls
load-bearing column
load-bearing beam
load-bearing structure
seam weld
seam allowance
shapefile
shape file
l shape
u shape
in shape
